name: ci

on:
  push:
    branches: [development]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install cpm
        run: go install github.com/CognitiveOS-Project/cpm/cmd/cpm@v1.0.9-alpha

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Pack and verify
        run: make verify

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: cgp-archive
          path: "*.cgp"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and pack in CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          platforms: linux/amd64
          load: true
          tags: cgp-ci:local

      - name: Extract archive
        run: |
          id=$(docker create cgp-ci:local)
          docker cp $id:/out ./out
          docker rm $id

      - name: Show package info
        run: cat out/pkg.json

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: cgp-archive-docker
          path: "out/*"
